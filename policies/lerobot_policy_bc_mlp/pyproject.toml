[project]
# The name must start with `lerobot_policy_`: LeRobot imports installed distributions with this
# prefix at startup, which registers the policy (lerobot/utils/import_utils.py,
# register_third_party_plugins; docs: huggingface.co/docs/lerobot/bring_your_own_policies).
name = "lerobot_policy_bc_mlp"
version = "0.1.0"
description = "Single-step behaviour cloning baseline (ResNet-18 image features + MLP) as a LeRobot policy plugin"
requires-python = ">=3.12"
dependencies = ["lerobot>=0.6.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_policy_bc_mlp"]
