[project]
name = "bimanual-vla-challenge"
version = "0.1.0"
description = "Bimanual VLA table-setting: dual SO-101 arms in MuJoCo, OpenVINO inference on Intel Core Ultra"
readme = "README.md"
# LeRobot 0.6.x declares requires-python >=3.12 upstream; <3.14 because torch
# (capped by lerobot at <2.12) does not ship cp314 wheels across all platforms yet.
requires-python = ">=3.12,<3.14"

dependencies = [
    "lerobot>=0.6.1",   # brings torch, torchvision, gymnasium, numpy, huggingface-hub
    "mujoco>=3.12.0",
    "ikpy>=4.1.0",
    "imageio[ffmpeg]>=2.34",
]

[project.optional-dependencies]
# Mac / i7-8565U: sim dev, rollout generation, eval harness, early OpenVINO export testing.
local = [
    "openvino>=2026.3.0",   # NOT openvino-dev: discontinued after 2024.6, ovc now ships in the runtime pkg
    "nncf>=3.3.0",
    "onnx>=1.17",
]
# Cloud GPU box: policy fine-tuning only.
train = [
    # Restated here so the CUDA index source below can bind to them; the version
    # window mirrors lerobot's own torch>=2.7,<2.12 / torchvision>=0.22,<0.27 cap.
    "torch>=2.7,<2.12",
    "torchvision>=0.22,<0.27",
    "wandb>=0.18",
    "tensorboard>=2.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim", "policy", "inference", "eval", "openvino_bench"]

# --- torch index routing -----------------------------------------------------
# local  -> PyPI torch. On macOS that IS the CPU/MPS build; nothing to override.
# train  -> CUDA build from PyTorch's own index, Linux only (the cloud GPU box).
# Change cu128 to match the CUDA version the rented instance actually ships.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "train", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", extra = "train", marker = "sys_platform == 'linux'" }]

[tool.uv]
# local and train must never resolve together: they pull different torch builds.
conflicts = [[{ extra = "local" }, { extra = "train" }]]
